services:
  api:
    build: .
    container_name: risk-intelligence-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./logs:/app/logs
      - ./models:/app/models
      - ./data:/app/data
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://risk_user:risk_password@db:5432/risk_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      APP_MODE: ${APP_MODE:-docker-compose}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  db:
    image: postgres:16
    container_name: risk-intelligence-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-risk_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-risk_password}
      POSTGRES_DB: ${POSTGRES_DB:-risk_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-risk_user} -d ${POSTGRES_DB:-risk_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: risk-intelligence-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: node:22-alpine
    container_name: risk-intelligence-frontend
    restart: unless-stopped
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:8000}
    depends_on:
      api:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  postgres_data:
  redis_data:
